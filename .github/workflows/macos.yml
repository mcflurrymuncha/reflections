name: Compile Void Engine (macOS)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/workflows/windows.yml'
      - '.github/workflows/linux.yml'
      - 'index.html'
      - 'redme.md'
      - 'README.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '.github/workflows/windows.yml'
      - '.github/workflows/linux.yml'
      - 'index.html'
      - 'redme.md'
      - 'README.md'

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository Source
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pypresence pyinstaller

    - name: Compile Standard App Build
      run: |
        pyinstaller --noconfirm --onedir --windowed --name="reflections_beta" reflections.py

    - name: Compile Debug Build (Console)
      run: |
        pyinstaller --noconfirm --onedir --name="reflections_debug" reflections.py

    - name: Package Runtime Assets into Both Builds
      run: |
        BETA_TARGET="dist/reflections_beta.app/Contents/MacOS"
        DEBUG_TARGET="dist/reflections_debug"

        TARGETS=("$BETA_TARGET" "$DEBUG_TARGET")

        for TARGET in "${TARGETS[@]}"; do
          if [ -d "$TARGET" ]; then
            if [ -f "song.mp3" ]; then
              cp "song.mp3" "$TARGET/"
            else
              echo "[warning] song.mp3 not found in root, proceeding with quiet mode build for $TARGET."
            fi
            
            mkdir -p "$TARGET/characters"
            echo "the commitment is crazy" > "$TARGET/characters/yuri.chr"
          fi
        done

    - name: Upload Binary Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: reflections-macos-builds
        path: dist/
        if-no-files-found: error
