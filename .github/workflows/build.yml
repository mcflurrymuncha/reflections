name: build godot windows version

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  export_windows:
    runs-on: ubuntu-latest
    
    # Use a pre-configured Godot CI container to save download and setup time
    container:
      image: barichello/godot-ci:4.2.1

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: create export directories
        run: |
          mkdir -v -p build/windows
          mkdir -v -p ~/.local/share/godot/export_templates/4.2.1.stable

      - name: link godot export templates
        run: |
          ln -s /root/.local/share/godot/export_templates/4.2.1.stable ~/.local/share/godot/export_templates/4.2.1.stable

      - name: headless export to windows exe
        run: |
          godot --headless --export-release "Windows Desktop" build/windows/reflections.exe

      - name: upload single windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reflections-windows
          path: build/windows/

      - name: create github release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/reflections.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
