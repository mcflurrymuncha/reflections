name: build godot windows version

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  export_windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      # FIX: Copy the pre-installed templates to the GitHub environment path
      - name: prepare godot template directories
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/4.2.1.stable /github/home/.local/share/godot/export_templates/
          mkdir -p build/windows

      - name: import resources/initialize project cache
        run: |
          godot --headless --editor --quit || true

      - name: headless export to windows exe
        run: |
          godot --headless --export-release "Windows Desktop" ./build/windows/reflections.exe

      - name: upload single windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reflections-windows
          path: build/windows/

      - name: create github release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/reflections.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
