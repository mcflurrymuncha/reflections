name: build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: install ren'py cli & build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zenity
          wget https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xjf renpy-8.2.1-sdk.tar.bz2
          echo "$(pwd)/renpy-8.2.1-sdk" >> $GITHUB_PATH

      - name: package game distributions
        run: |
          ./renpy-8.2.1-sdk/renpy.sh ./renpy-8.2.1-sdk/launcher distribute ./

      - name: upload build artifacts to github
        uses: actions/upload-artifact@v4
        with:
          name: reflections-distributions
          path: |
            *-dists/*.zip
            *-dists/*.tar.bz2
            *-dists/*.exe

      - name: create github release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *-dists/*.zip
            *-dists/*.tar.bz2
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
