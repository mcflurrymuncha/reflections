<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reflections.</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Cambria', 'Georgia', serif;
            color: #d2d7dc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient snowfall canvas backdrop */
        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Interface wrapper */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: normal;
            letter-spacing: 0.3rem;
            margin-bottom: 10px;
            color: #d2d7dc;
            text-shadow: 0 0 10px rgba(210, 215, 220, 0.2);
        }

        p.subtitle {
            font-size: 0.95rem;
            font-style: italic;
            letter-spacing: 0.1rem;
            color: #707075;
            margin-bottom: 40px;
        }

        .download-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .download-btn {
            display: inline-block;
            min-width: 240px;
            padding: 12px 24px;
            background-color: #050505;
            color: #d2d7dc;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid #8c8c91;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: #19191e;
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .download-btn span {
            display: block;
            font-size: 0.7rem;
            color: #707075;
            margin-top: 3px;
            text-transform: lowercase;
        }
    </style>
</head>
<body>

    <canvas id="snowCanvas"></canvas>

    <div class="container">
        <h1>reflections</h1>
        <p class="subtitle">-- an existential void of knowledge --</p>
        
        <div class="download-box">
            <a href="https://github.com/mcflurrymuncha/reflections/releases/download/v1/reflections-stable-windows.zip" class="download-btn">
                download
                <span>recommended version. more stable</span>
            </a>
            
            <a href="https://github.com/mcflurrymuncha/reflections/releases/download/v1/reflections-beta-windows.zip" class="download-btn">
                download beta edition
                <span>with debug console, higher chances of crashes</span>
            </a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const snowflakes = [];
        const numFlakes = 140;

        function createSnowflake(initial = false) {
            return {
                x: Math.random() * width,
                y: initial ? Math.random() * height : Math.random() * -20 - 5,
                radius: Math.random() * 2.6 + 1.2, // matching 1.2 to 3.8 radius size
                speedY: Math.random() * 1.2 + 0.6, // matching 0.6 to 1.8 speed
                swayAmplitude: Math.random() * 0.9 + 0.3,
                swaySpeed: Math.random() * 1.6 + 1.2,
                phase: Math.random() * 100
            };
        }

        // Initialize array populate
        for (let i = 0; i < numFlakes; i++) {
            snowflakes.push(createSnowflake(true));
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#f5f5fa'; // Matching original Pygame flake color tuple (245, 245, 250)

            const currentTime = Date.now() * 0.001;

            for (let i = 0; i < snowflakes.length; i++) {
                let flake = snowflakes[i];
                
                flake.y += flake.speedY;
                flake.x += Math.sin(currentTime * flake.swaySpeed + flake.phase) * flake.swayAmplitude;

                // Reset bound metrics if dropped off target screen floor
                if (flake.y > height + 10) {
                    snowflakes[i] = createSnowflake(false);
                }

                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
