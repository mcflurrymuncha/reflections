<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reflections.</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Cambria', 'Georgia', serif;
            color: #d2d7dc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient snowfall canvas backdrop */
        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Interface wrapper */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: normal;
            letter-spacing: 0.3rem;
            margin-bottom: 10px;
            color: #d2d7dc;
            text-shadow: 0 0 10px rgba(210, 215, 220, 0.2);
        }

        p.subtitle {
            font-size: 0.95rem;
            font-style: italic;
            letter-spacing: 0.1rem;
            color: #707075;
            margin-bottom: 40px;
        }

        .download-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .os-group {
            width: 100%;
        }

        .os-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15rem;
            color: #505055;
            margin-bottom: 10px;
            text-align: center;
        }

        .download-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .download-btn {
            display: inline-block;
            padding: 12px 15px;
            background-color: #050505;
            color: #d2d7dc;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid #8c8c91;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .download-btn:hover {
            background-color: #19191e;
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .download-btn span {
            display: block;
            font-size: 0.7rem;
            color: #707075;
            margin-top: 3px;
            text-transform: lowercase;
        }

        /* Stack buttons on small screens */
        @media (max-width: 480px) {
            .download-box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <canvas id="snowCanvas"></canvas>

    <div class="container">
        <h1>reflections.</h1>
        <p class="subtitle">-- an existential void of knowledge --</p>
        
        <div class="download-container">
            <!-- Windows Platform -->
            <div class="os-group">
                <div class="os-title">Windows</div>
                <div class="download-box">
                    <a href="https://github.com/mcflurrymuncha/reflections/releases/download/latest/reflections_windows_stable.zip" class="download-btn">
                        download
                        <span>recommended version. stable</span>
                    </a>
                    <a href="https://github.com/mcflurrymuncha/reflections/releases/download/latest/reflections_windows_beta.zip" class="download-btn">
                        beta edition
                        <span>with debug console</span>
                    </a>
                </div>
            </div>

            <!-- Linux Platform -->
            <div class="os-group">
                <div class="os-title">Linux</div>
                <div class="download-box">
                    <a href="https://github.com/mcflurrymuncha/reflections/releases/download/latest/reflections_linux_stable.zip" class="download-btn">
                        download
                        <span>recommended version. stable</span>
                    </a>
                    <a href="https://github.com/mcflurrymuncha/reflections/releases/download/latest/reflections_linux_beta.zip" class="download-btn">
                        beta edition
                        <span>with debug console</span>
                    </a>
                </div>
            </div>

            <!-- macOS Platform -->
            <div class="os-group">
                <div class="os-title">macOS</div>
                <div class="download-box">
                    <a href="https://github.com/mcflurrymuncha/reflections/releases/download/latest/reflections_macos_stable.zip" class="download-btn">
                        download
                        <span>recommended version. stable</span>
                    </a>
                    <a href="https://github.com/mcflurrymuncha/reflections/releases/download/latest/reflections_macos_beta.zip" class="download-btn">
                        beta edition
                        <span>with debug console</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const snowflakes = [];
        const numFlakes = 140;

        function createSnowflake(initial = false) {
            return {
                x: Math.random() * width,
                y: initial ? Math.random() * height : Math.random() * -20 - 5,
                radius: Math.random() * 2.6 + 1.2,
                speedY: Math.random() * 1.2 + 0.6,
                swayAmplitude: Math.random() * 0.9 + 0.3,
                swaySpeed: Math.random() * 1.6 + 1.2,
                phase: Math.random() * 100
            };
        }

        for (let i = 0; i < numFlakes; i++) {
            snowflakes.push(createSnowflake(true));
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#f5f5fa';

            const currentTime = Date.now() * 0.001;

            for (let i = 0; i < snowflakes.length; i++) {
                let flake = snowflakes[i];
                
                flake.y += flake.speedY;
                flake.x += Math.sin(currentTime * flake.swaySpeed + flake.phase) * flake.swayAmplitude;

                if (flake.y > height + 10) {
                    snowflakes[i] = createSnowflake(false);
                }

                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
